services:
  mongodb:
    image: mongo:6.0
    container_name: resume_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - resume-network

  backend:
    build: ./backend
    container_name: resume_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    environment:
      - MONGODB_CONNECTION_STRING=mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb:27017/${MONGODB_NAME}?authSource=admin
      - PYTHONUNBUFFERED=1
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,backend:8000
      # Local dev: print AI_RAW / AI_RESULT lines to container stdout (docker logs -f resume_backend)
      - DEEPSEEK_LOG_AI_RESPONSES=1
    depends_on:
      mongodb:
        condition: service_healthy
    # Ensure openai SDK exists (avoids ModuleNotFoundError if image predates Dockerfile openai line)
    command: sh -c "pip install -q 'openai>=1.54.0' 'anthropic>=1.11.0,<2' 'prometheus-client>=0.26,<1' && python manage.py migrate 2>&1 | grep -v 'Operations to perform' | grep -v 'Running migrations' | grep -v 'No migrations to apply' | grep -v 'Apply all migrations' || true && PYTHONUNBUFFERED=1 python manage.py runserver 0.0.0.0:8000"
    networks:
      - resume-network

  frontend:
    build: ./frontend/skill-step-form
    container_name: resume_frontend
    restart: always
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/skill-step-form:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
      # Vite dev proxy runs inside this container — use Compose service name, not 127.0.0.1
      - VITE_BACKEND_URL=http://backend:8000
    # npm ci: clean install from lockfile so Rollup optional @rollup/rollup-linux-* bins match the container OS/arch
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - resume-network

  # Next.js public/SEO site (landing, templates, pricing, blog, about, careers, contact).
  # Dev server on http://localhost:3000 — separate from the Vite SPA on :5173.
  web:
    image: node:20
    container_name: resume_web
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-next:/app
      # Keep node_modules inside the container (correct Linux binaries, no host conflict).
      - /app/node_modules
    command: sh -c "npm install && npx next dev -H 0.0.0.0 -p 3000"
    networks:
      - resume-network

  # Claude connector (MCP server): users edit their resumes from Claude.
  # Opt-in: docker compose --profile connector up -d connector
  connector:
    # Same image and code as the backend; no separate build.
    image: my-simple-resume-backend
    container_name: resume_connector
    restart: always
    profiles: ["connector"]
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    environment:
      - MONGODB_CONNECTION_STRING=mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb:27017/${MONGODB_NAME}?authSource=admin
      - PYTHONUNBUFFERED=1
      - CONNECTOR_PUBLIC_URL=http://localhost:8100
      - CONNECTOR_ALLOWED_HOSTS=localhost:8100,127.0.0.1:8100
    command: sh -c "pip install -q 'mcp>=2.3,<3' 'anthropic>=1.11.0,<2' 'prometheus-client>=0.26,<1' && python -m connector.server"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - resume-network

  # --- Admin dashboards: Prometheus collects, Grafana shows (at /grafana/) ---
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: resume_prometheus
    restart: always
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - resume-network

  grafana:
    image: grafana/grafana:13.2.4
    container_name: resume_grafana
    restart: always
    profiles: ["monitoring"]
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:3030/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/123resume-overview.json
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - resume-network

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: resume_node_exporter
    restart: always
    profiles: ["monitoring"]
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      # No rslave: Docker Desktop (macOS) can't propagate mounts; the server's file keeps it.
      - /:/host:ro
    networks:
      - resume-network

volumes:
  prometheus_data:
  grafana_data:
  mongodb_data:

networks:
  resume-network:
    driver: bridge
