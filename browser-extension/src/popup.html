<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="logo">123<b>Resume</b></span>
      <span class="tag">Jobs</span>
    </header>

    <main id="main">
      <p id="status" class="muted">Loading…</p>

      <div id="connect" hidden>
        <p>Sign in to 123Resume, then come back here.</p>
        <button id="open-login" class="primary">Open 123Resume login</button>
      </div>

      <div id="ready" hidden>
        <label for="resume">Resume</label>
        <select id="resume"></select>

        <section class="block">
          <div class="row">
            <span class="section-title">Openings for you</span>
            <button id="find" class="link">Refresh</button>
          </div>
          <label class="check"><input type="checkbox" id="germany" checked /> Germany &amp; remote only</label>
          <div id="jobs" class="jobs"></div>
          <div id="jobs-pager" class="pager"></div>
          <p id="jobs-note" class="muted small"></p>
        </section>

        <section class="block">
          <div class="save-row">
            <button id="save" class="primary">Save this job</button>
            <button id="applied" class="secondary">I applied</button>
          </div>
          <p id="result" class="result"></p>
          <p class="muted small">
            Open any job posting, then press “Save this job”. We read the page,
            Claude tidies it into a clean record, and it’s stored in your
            123Resume job tracker. “I applied” saves it as applied.
          </p>
        </section>

        <button id="disconnect" class="link">Disconnect</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
