services:
  mongodb:
    image: mongo:6.0
    container_name: resume_mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017" # Only accessible from localhost
    volumes:
      - mongodb_data:/data/db
      - ./backup:/backup # For backups
    env_file:
      - ./.env # Load Mongo credentials from root .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_NAME}
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - resume-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: resume_backend
    restart: always
    expose:
      - "8000" # Only expose internally
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      # MONGODB_CONNECTION_STRING lives in .env, built with URL-encoded credentials.
      # Building it here pasted the raw password into the URL, and a "+" in it
      # reached MongoDB as a space, so every login with this string failed.
      - ./.env # Load env from root
    environment:
      # gunicorn workers write metrics here and /internal/metrics merges them.
      # Emptied on every start (stale files from old workers would double count).
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    depends_on:
      mongodb:
        condition: service_healthy
    command: sh -c "rm -rf /tmp/prometheus_multiproc && mkdir -p /tmp/prometheus_multiproc && python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60"
    networks:
      - resume-network

  frontend:
    build:
      context: ./frontend/skill-step-form
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://${DOMAIN}/api
        VITE_XING_CONSUMER_KEY: ${XING_CLIENT_ID}
    container_name: resume_frontend
    restart: always
    expose:
      - "80"
    volumes:
      - frontend_volume:/usr/share/nginx/html
    networks:
      - resume-network

  nginx:
    image: nginx:alpine
    container_name: resume_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - frontend_volume:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - resume-network

  certbot:
    image: certbot/certbot
    container_name: resume_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - resume-network

  # Claude connector (MCP server, connector/server.py): users edit their resumes
  # from Claude. Same image and code as the backend; served at /mcp by the gateway.
  connector:
    image: my-simple-resume-backend
    container_name: resume_connector
    restart: always
    expose:
      - "8100"
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    environment:
      - CONNECTOR_PUBLIC_URL=https://${DOMAIN}
      - CONNECTOR_ALLOWED_HOSTS=${DOMAIN},www.${DOMAIN}
    command: python -m connector.server
    networks:
      - resume-network

  # --- Admin dashboards: Prometheus collects, Grafana shows (at /grafana/) ---
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: resume_prometheus
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - resume-network

  grafana:
    image: grafana/grafana:13.2.4
    container_name: resume_grafana
    restart: always
    environment:
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/123resume-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - resume-network

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: resume_node_exporter
    restart: always
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - resume-network

volumes:
  prometheus_data:
  grafana_data:
  mongodb_data:
  static_volume:
  media_volume:
  frontend_volume:

networks:
  resume-network:
    driver: bridge
